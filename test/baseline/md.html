<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Chapter — geek-book</title>
<meta name="description" content="the user's guide">
<meta name="author" content="geek-book">
<meta property="og:type" content="website">
<meta property="og:site_name" content="geek-book">
<meta property="og:title" content="Golden Chapter — geek-book">
<meta property="og:description" content="the user's guide">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Golden Chapter — geek-book">
<meta name="twitter:description" content="the user's guide">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --accent: #2563eb;
    --accent-soft: #eff4ff;
    --radius: 8px;
    --measure: 44rem;
    --font-sans: "Literata", "Iowan Old Style", Georgia, "Times New Roman", serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
:root {
  --fg: #242a37;
  --muted: #667085;
  --rule: #e4e7ec;
  --code-bg: #f6f7f9;
  --code-fg: #20304c;
  --code-comment: #6b7280;
  --callout-bg: #f8fafc;
  --callout-border: #cbd5e1;
  --quote-fg: #3b4252;
}

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 17px;
    line-height: 1.65;
    color: var(--fg);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  header.site-header {
    border-bottom: 1px solid var(--rule);
    background: var(--bg);
  }

  .site-header-inner {
    max-width: var(--measure);
    margin: 0 auto;
    padding: 1rem 1.5rem;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
  }

  .site-header-inner .brand {
    font-weight: 700;
    font-size: 1rem;
    color: var(--fg);
    text-decoration: none;
    letter-spacing: -0.01em;
  }

  .site-header-inner .brand em {
    font-style: normal;
    color: var(--accent);
  }

  .site-header-inner .tagline {
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  main.page {
    max-width: var(--measure);
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
  }

  main.page h1 {
    font-size: 1.9rem;
    line-height: 1.25;
    letter-spacing: -0.02em;
    margin: 0 0 1.5rem;
    padding-bottom: 0.75rem;
    border-bottom: 2px solid var(--rule);
  }

  h2 {
    font-size: 1.35rem;
    letter-spacing: -0.01em;
    margin: 2.25rem 0 0.75rem;
    padding-top: 0.5rem;
  }

  h3 { font-size: 1.12rem; margin: 1.75rem 0 0.5rem; }
  h4 { font-size: 1rem; margin: 1.5rem 0 0.5rem; }
  h5, h6 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }

  h2, h3, h4 { line-height: 1.35; }

  p { margin: 0.9rem 0; }

  a { color: var(--fg); text-decoration: underline; text-underline-offset: 2px; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }
  a code { color: inherit; }

  ul, ol { margin: 0.9rem 0; padding-left: 1.5rem; }
  li { margin: 0.35rem 0; }
  li::marker { color: var(--muted); }

  hr {
    border: 0;
    border-top: 1px solid var(--rule);
    margin: 2.5rem 0;
  }

  blockquote {
    margin: 1.25rem 0;
    padding: 0.8rem 1rem 0.8rem 1.25rem;
    border-left: 4px solid var(--callout-border);
    background: var(--callout-bg);
    border-radius: 0 var(--radius) var(--radius) 0;
    color: #3b4252;
  }
  blockquote p:first-child { margin-top: 0; }
  blockquote p:last-child { margin-bottom: 0; }

  pre {
    margin: 1.25rem 0;
    padding: 1rem 1.25rem;
    background: var(--code-bg);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    overflow-x: auto;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    line-height: 1.55;
    color: var(--code-fg);
  }
  /* Book-content rules shared by the two targets that emit the same markup: the
   web book's reading column and the standalone page layout (_layouts/default.html).
   Both mark their content area with the .book-body class, so these rules are
   written once instead of being copy-pasted into two stylesheets to drift apart.

   This file is pasted into the web book's stylesheet (src/build-web-book/site.css,
   assembled by src/build-web-book/site.ts) and inlined into the standalone page
   by src/md-to-html/render.ts. The palettes own the colours it reads:
   --code-comment, --code-fg and --font-mono come from the enclosing page's :root. */

.book-body pre code { background: none; padding: 0; border: 0; font-size: inherit; color: inherit; }
.book-body pre code .code-comment { color: var(--code-comment); }
.book-body .code-block { position: relative; }
.book-body .code-label {
  position: absolute; top: 0.5rem; right: 0.7rem;
  font-family: var(--font-mono); font-size: 0.62rem;
  letter-spacing: 0.05em; color: var(--code-comment);
}
.book-body :not(pre) > code { font-family: var(--font-mono); font-size: 0.84em; color: var(--code-fg); }

.book-body .diagram { margin: 1.3rem auto; text-align: center; }
.book-body .diagram svg { max-width: 100%; height: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    margin: 1.25rem 0;
    font-size: 0.92rem;
  }
  th {
    text-align: left;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    color: var(--muted);
    border-bottom: 2px solid var(--rule);
    padding: 0.5rem 0.75rem;
  }
  td {
    border-bottom: 1px solid var(--rule);
    padding: 0.55rem 0.75rem;
    vertical-align: top;
  }
  tbody tr:nth-child(even) { background: #fafbfc; }

  img { max-width: 100%; height: auto; border-radius: var(--radius); }

  footer.site-footer {
    border-top: 1px solid var(--rule);
    font-size: 0.82rem;
    color: var(--muted);
  }
  .site-footer-inner {
    max-width: var(--measure);
    margin: 0 auto;
    padding: 1.25rem 1.5rem 2rem;
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  @media (max-width: 600px) {
    body { font-size: 16px; }
    main.page { padding-top: 1.75rem; }
    .site-header-inner .tagline { display: none; }
  }

  @media print {
    header.site-header, footer.site-footer { display: none; }
    main.page { max-width: none; padding: 0; }
    pre { white-space: pre-wrap; }
  }
</style>
</head>
<body>
<header class="site-header">
  <div class="site-header-inner">
    <a class="brand" href="/"><em>geek-book</em></a>
    <span class="tagline">the user's guide</span>
  </div>
</header>
<!-- The reading column. src/lib/content.css hooks its rules onto .book-body,
     the same class the web book's column carries. -->
<main class="page book-body">
<h1 id="golden-chapter">Golden Chapter</h1><p>A paragraph with 0.1.5 and geek-book.</p>
<h2 id="section-one">Section One</h2><p>Some text with <code>inline</code> code and <del>strike</del>.</p>
<div class="code-block"><span class="code-label">Rust</span><pre><code class="language-rust"><span class="code-comment">// a comment</span>
fn main() {}</code></pre></div><ul>
<li>One</li>
<li>Two</li>
</ul>
<table>
<thead>
<tr>
<th>A</th>
<th>B</th>
</tr>
</thead>
<tbody><tr>
<td>1</td>
<td>2</td>
</tr>
</tbody></table>
<p><a href="#section-one">link to self</a></p>
<p><img src="images/bird.png" alt="alt"></p>

</main>
<footer class="site-footer">
  <div class="site-footer-inner">
    <span>geek-book</span>
    <span><a href="/">Home</a></span>
  </div>
</footer>
</body>
</html>
