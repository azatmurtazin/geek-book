# Pre-commit hooks for a book (https://pre-commit.com).
#
# The git hook itself lives in .git/hooks and is not tracked, so each clone
# needs to enable it once:
#
#     pre-commit install
#
# After that every `git commit` runs the hooks below; run them by hand with
# `pre-commit run --all-files`. The local hooks use the host's `just`, which
# installs the engine on demand; the build writes only to the git-ignored
# build/, so it never dirties the working tree.
#
# `fail_fast` stops at the first failing hook, so a whitespace or lint failure
# does not pay for the book build that follows.
#
# Developed against pre-commit 4.6.2 (the current release).

fail_fast: true

repos:
  # Standard file hygiene: strip trailing whitespace, terminate the last line,
  # sanity-check YAML/JSON, catch conflict markers and oversized additions.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      # book/cover.jpg is around 700 KB; the default 500 KB limit would reject it.
      - id: check-added-large-files
        args: [--maxkb=2000]

  - repo: local
    hooks:
      # `just lint` — the engine's summary, chapter, link and config checks.
      - id: lint
        name: lint the book
        entry: just lint
        language: system
        pass_filenames: false
        always_run: true

      # The two editions: build/html/ (website) and build/book.pdf (print).
      - id: build-book
        name: build the book (website + PDF)
        entry: "bash -c 'just html && just pdf'"
        language: system
        pass_filenames: false
        always_run: true
