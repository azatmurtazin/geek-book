name: Release

# On a version tag (v*), lint and test the tree, build both editions of the
# guide with the engine's own Docker image and publish them as assets on the
# GitHub Release: the print PDF
# (geek-book-<version>.pdf), the website packed as a zip
# (geek-book-<version>-web.zip), and the
# engine package itself (geek-book-<version>.tgz, from `npm pack`), so a book
# repo can pin a built engine instead of a git checkout. Downloads then live
# with the tag instead of expiring with a workflow run; re-running the workflow
# updates the release in place.
#
# This is the book-side `templates/.github/workflows/release.yml` for the engine
# itself: there is no engine to check out next to the repo, and the guide is
# built the same way `just docker-book` builds it.
#
# Bump `version` in package.json and tag `v<version>`; the tag is checked against
# the package version below, and the guide's {{ version }} reads the same number.

on:
  push:
    tags: ["v*"]
  # Re-publish an existing release without moving its tag:
  #   gh workflow run release.yml -r v0.1.4
  # The tag/package check below still runs, so a dispatch on a branch fails.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the guide and the engine
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      # The tag is the released version; the book prints whatever package.json
      # says, so refuse to publish a release whose two numbers disagree.
      - name: Check the tag against package.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          if [[ "$declared" != "$version" ]]; then
            echo "tag $GITHUB_REF_NAME names $version, package.json says $declared" >&2
            exit 1
          fi

      # Cache the LaTeX-heavy engine image, then run the compose service the
      # `just docker-book` recipe uses to produce build/html/ and build/book.pdf.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Docker.book
          tags: geek-book/book:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The `book` service drops to the image's `node` user (uid 1000) but the
      # GitHub workspace is owned by uid 1001, so hand it to 1000 first, then
      # back to the runner so the steps below can read and write `build/`.
      # `just verify` cleans and rebuilds while the workspace is still
      # 1000-owned; a published tag must be the verified tree — a stale
      # baseline must fail here, before anything is uploaded.
      - name: Lint, test and verify the guide
        run: |
          sudo chown -R 1000:1000 .
          docker compose run --rm book just lint
          docker compose run --rm book just test
          docker compose run --rm book just verify
          sudo chown -R "$(id -u):$(id -g)" .

      - name: Pack the website and the engine
        run: |
          version="${GITHUB_REF_NAME#v}"
          ( cd build/html && zip -qr "${GITHUB_WORKSPACE}/build/geek-book-${version}-web.zip" . )
          cp build/book.pdf "build/geek-book-${version}.pdf"
          npm pack --pack-destination build

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          pdf="build/geek-book-${version}.pdf"
          zip="build/geek-book-${version}-web.zip"
          tarball="$(ls build/geek-book-*.tgz)"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # Drop assets this run no longer produces — say a file renamed
            # since the previous run — so "re-running updates the release in
            # place" leaves exactly the three assets named here.
            gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' |
              while read -r name; do
                case "$name" in
                  "geek-book-${version}.pdf"|"geek-book-${version}-web.zip"|"$(basename "$tarball")") ;;
                  *) gh release delete-asset "${GITHUB_REF_NAME}" "$name" --yes ;;
                esac
              done
            gh release upload "${GITHUB_REF_NAME}" "$pdf" "$zip" "$tarball" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "$pdf" "$zip" "$tarball" \
              --title "geek-book ${version}" \
              --generate-notes
          fi
