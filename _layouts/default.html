<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --fg: #242a37;
    --muted: #667085;
    --accent: #2563eb;
    --accent-soft: #eff4ff;
    --rule: #e4e7ec;
    --code-bg: #f6f7f9;
    --code-fg: #20304c;
    {{ code-vars }}
    --callout-bg: #f8fafc;
    --callout-border: #cbd5e1;
    --radius: 8px;
    --measure: 44rem;
    --font-sans: "Literata", "Iowan Old Style", Georgia, "Times New Roman", serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 17px;
    line-height: 1.65;
    color: var(--fg);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  header.site-header {
    border-bottom: 1px solid var(--rule);
    background: var(--bg);
  }

  .site-header-inner {
    max-width: var(--measure);
    margin: 0 auto;
    padding: 1rem 1.5rem;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
  }

  .site-header-inner .brand {
    font-weight: 700;
    font-size: 1rem;
    color: var(--fg);
    text-decoration: none;
    letter-spacing: -0.01em;
  }

  .site-header-inner .brand em {
    font-style: normal;
    color: var(--accent);
  }

  .site-header-inner .tagline {
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  main.page {
    max-width: var(--measure);
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
  }

  main.page h1 {
    font-size: 1.9rem;
    line-height: 1.25;
    letter-spacing: -0.02em;
    margin: 0 0 1.5rem;
    padding-bottom: 0.75rem;
    border-bottom: 2px solid var(--rule);
  }

  h2 {
    font-size: 1.35rem;
    letter-spacing: -0.01em;
    margin: 2.25rem 0 0.75rem;
    padding-top: 0.5rem;
  }

  h3 { font-size: 1.12rem; margin: 1.75rem 0 0.5rem; }
  h4 { font-size: 1rem; margin: 1.5rem 0 0.5rem; }
  h5, h6 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }

  h2, h3, h4 { line-height: 1.35; }

  p { margin: 0.9rem 0; }

  a { color: var(--fg); text-decoration: underline; text-underline-offset: 2px; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }
  a code { color: inherit; }

  ul, ol { margin: 0.9rem 0; padding-left: 1.5rem; }
  li { margin: 0.35rem 0; }
  li::marker { color: var(--muted); }

  hr {
    border: 0;
    border-top: 1px solid var(--rule);
    margin: 2.5rem 0;
  }

  blockquote {
    margin: 1.25rem 0;
    padding: 0.8rem 1rem 0.8rem 1.25rem;
    border-left: 4px solid var(--callout-border);
    background: var(--callout-bg);
    border-radius: 0 var(--radius) var(--radius) 0;
    color: #3b4252;
  }
  blockquote p:first-child { margin-top: 0; }
  blockquote p:last-child { margin-bottom: 0; }

  pre {
    margin: 1.25rem 0;
    padding: 1rem 1.25rem;
    background: var(--code-bg);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    overflow-x: auto;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    line-height: 1.55;
    color: var(--code-fg);
  }
  {{ code-css }}

  table {
    width: 100%;
    border-collapse: collapse;
    margin: 1.25rem 0;
    font-size: 0.92rem;
  }
  th {
    text-align: left;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    color: var(--muted);
    border-bottom: 2px solid var(--rule);
    padding: 0.5rem 0.75rem;
  }
  td {
    border-bottom: 1px solid var(--rule);
    padding: 0.55rem 0.75rem;
    vertical-align: top;
  }
  tbody tr:nth-child(even) { background: #fafbfc; }

  img { max-width: 100%; height: auto; border-radius: var(--radius); }

  {{ diagram-css }}

  footer.site-footer {
    border-top: 1px solid var(--rule);
    font-size: 0.82rem;
    color: var(--muted);
  }
  .site-footer-inner {
    max-width: var(--measure);
    margin: 0 auto;
    padding: 1.25rem 1.5rem 2rem;
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  @media (max-width: 600px) {
    body { font-size: 16px; }
    main.page { padding-top: 1.75rem; }
    .site-header-inner .tagline { display: none; }
  }

  @media print {
    header.site-header, footer.site-footer { display: none; }
    main.page { max-width: none; padding: 0; }
    pre { white-space: pre-wrap; }
  }
</style>
</head>
<body>
<header class="site-header">
  <div class="site-header-inner">
    <a class="brand" href="/">{{ brand }}</a>
    <span class="tagline">{{ tagline }}</span>
  </div>
</header>
<main class="page">
{{ content }}
</main>
<footer class="site-footer">
  <div class="site-footer-inner">
    <span>{{ book-title }}</span>
    <span><a href="/">Home</a></span>
  </div>
</footer>
</body>
</html>
