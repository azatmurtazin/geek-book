# Link check configuration for the engine's own docs (https://lychee.cli.rs).
#
# Remote links only. Local file paths and #anchors are `geek-book lint`'s job —
# it resolves them offline, and it understands the book-root absolute image
# sources (`/images/…`) the prose may use.
#
# The sample book links off the site once, on its "sample page", so the job has
# something to check on its own as well as for a book that copies this file.
#
# `root_dir` still has to be set: lychee reads root-relative links while parsing
# the Markdown, before the scheme filter runs, and refuses to parse one without
# a directory to resolve it against. It points at the book, which is what a
# root-relative path in a book repo counts from.

scheme = ["https", "http"]
root_dir = "book"

max_redirects = 10
timeout = 20

# A 429 is "slow down", not a dead link.
accept = ["200..=299", "429"]

# Nothing is excluded: a link the sample carries is meant to be reachable, and a
# dead one is worth noticing here as much as in a book repo.
exclude = []
