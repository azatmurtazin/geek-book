# Link check configuration for the engine's own docs (https://lychee.cli.rs).
#
# Only the engine's README and the sample book are checked. The sample is
# placeholder prose and links nowhere, so this file is mostly a starting point
# for a book that copies the link-check workflow.

max_redirects = 10
timeout = 20

# The sample book is a fixture; do not let a dead link outside this repo fail
# the engine's own pipeline while the book repos keep their own configs.
exclude = []
